name: Container images

on:
  pull_request:
    branches:
      - dev
      - uat
      - main
    paths:
      - .github/workflows/images.yml
      - .dockerignore
      - .npmrc
      - package.json
      - package-lock.json
      - tsconfig.base.json
      - apps/**
      - packages/**
      - infra/docker/**
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.component }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: auth-service
            dockerfile: infra/docker/auth-service/Dockerfile
            target: runtime
          - component: video-service
            dockerfile: infra/docker/video-service/Dockerfile
            target: runtime
          - component: processor-service
            dockerfile: infra/docker/processor-service/Dockerfile
            target: runtime
          - component: notification-service
            dockerfile: infra/docker/notification-service/Dockerfile
            target: runtime
          - component: frontend
            dockerfile: infra/docker/frontend/Dockerfile
            target: runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: fiap-x/${{ matrix.component }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }},ignore-error=true

      - name: Verify Node.js runtime
        run: docker run --rm --entrypoint node "fiap-x/${{ matrix.component }}:ci-${{ github.sha }}" --version

      - name: Verify FFmpeg runtime
        if: matrix.component == 'processor-service'
        run: docker run --rm --entrypoint ffmpeg "fiap-x/${{ matrix.component }}:ci-${{ github.sha }}" -version

  publish:
    name: Publish ${{ matrix.component }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: auth-service
            dockerfile: infra/docker/auth-service/Dockerfile
            target: runtime
          - component: video-service
            dockerfile: infra/docker/video-service/Dockerfile
            target: runtime
          - component: processor-service
            dockerfile: infra/docker/processor-service/Dockerfile
            target: runtime
          - component: notification-service
            dockerfile: infra/docker/notification-service/Dockerfile
            target: runtime
          - component: frontend
            dockerfile: infra/docker/frontend/Dockerfile
            target: runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define image name
        id: image
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == 'branch' && "${GITHUB_REF_NAME}" == 'main' ]]; then
            version="sha-${GITHUB_SHA}"
          elif [[ "${GITHUB_REF_TYPE}" == 'tag' && "${GITHUB_REF_NAME}" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            version="${GITHUB_REF_NAME}"
          else
            echo "Unsupported release ref: ${GITHUB_REF}" >&2
            exit 1
          fi
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fiap-x-${COMPONENT}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fiap-x-${COMPONENT}:${version}"
            if [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
              echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fiap-x-${COMPONENT}:sha-${GITHUB_SHA}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }},ignore-error=true

      - name: Verify Node.js runtime
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
        run: docker run --rm --entrypoint node "${IMAGE_NAME}:${VERSION}" --version

      - name: Verify FFmpeg runtime
        if: matrix.component == 'processor-service'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
        run: docker run --rm --entrypoint ffmpeg "${IMAGE_NAME}:${VERSION}" -version

      - name: Publish immutable tags
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker push "${IMAGE_NAME}:${VERSION}"
          if [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            docker push "${IMAGE_NAME}:sha-${COMMIT_SHA}"
          fi

  deploy-production:
    name: Deploy production
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-production.yml
    with:
      image_tag: sha-${{ github.sha }}
    secrets: inherit
