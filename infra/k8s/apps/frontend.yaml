apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: fiap-x
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: fiap-x
data:
  FRONTEND_HOST: 0.0.0.0
  FRONTEND_PORT: '8080'
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fiap-x
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: fiap-x
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fiap-x
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: fiap-x
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: fiap-x
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: frontend
          image: fiap-x/frontend:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: frontend-config
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
