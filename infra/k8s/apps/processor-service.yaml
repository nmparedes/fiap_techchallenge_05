apiVersion: v1
kind: ConfigMap
metadata:
  name: processor-service-config
  namespace: fiap-x
  labels:
    app.kubernetes.io/name: processor-service
    app.kubernetes.io/part-of: fiap-x
data:
  PROCESSOR_PORT: '3003'
  PROCESSOR_PREFETCH: '1'
  PROCESSOR_SHUTDOWN_TIMEOUT_MS: '10000'
---
apiVersion: v1
kind: Service
metadata:
  name: processor-service
  namespace: fiap-x
  labels:
    app.kubernetes.io/name: processor-service
    app.kubernetes.io/part-of: fiap-x
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/path: /metrics
    prometheus.io/port: '3003'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: processor-service
  ports:
    - name: http
      port: 3003
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor-service
  namespace: fiap-x
  labels:
    app.kubernetes.io/name: processor-service
    app.kubernetes.io/part-of: fiap-x
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: processor-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: processor-service
        app.kubernetes.io/part-of: fiap-x
    spec:
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 20
      containers:
        - name: processor-service
          image: fiap-x/processor-service:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: fiap-x-dependencies-config
            - configMapRef:
                name: processor-service-config
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: fiap-x-dependencies
                  key: RABBITMQ_URL
          ports:
            - name: http
              containerPort: 3003
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: video-storage
              mountPath: /data/videos
      volumes:
        - name: video-storage
          persistentVolumeClaim:
            claimName: video-storage
