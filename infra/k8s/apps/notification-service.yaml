apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: fiap-x
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: fiap-x
data:
  NOTIFICATION_PORT: '3004'
  NOTIFICATION_DEFAULT_PAGE_SIZE: '20'
  NOTIFICATION_MAXIMUM_PAGE_SIZE: '100'
  AUTH_JWT_ISSUER: fiap-x-auth-service
  AUTH_JWT_AUDIENCE: fiap-x-api
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: fiap-x
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: fiap-x
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/path: /metrics
    prometheus.io/port: '3004'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notification-service
  ports:
    - name: http
      port: 3004
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: fiap-x
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: fiap-x
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
        app.kubernetes.io/part-of: fiap-x
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: notification-service
          image: fiap-x/notification-service:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: fiap-x-dependencies-config
            - configMapRef:
                name: notification-service-config
          env:
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fiap-x-application
                  key: AUTH_JWT_SECRET
            - name: MYSQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fiap-x-dependencies
                  key: MYSQL_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fiap-x-dependencies
                  key: MYSQL_PASSWORD
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: fiap-x-dependencies
                  key: RABBITMQ_URL
          ports:
            - name: http
              containerPort: 3004
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
