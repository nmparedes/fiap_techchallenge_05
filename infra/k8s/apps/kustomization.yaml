apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fiap-x

resources:
  - auth-service.yaml
  - video-service.yaml
  - processor-service.yaml
  - notification-service.yaml
  - frontend.yaml
  - autoscaling.yaml
  - ingress.yaml

images:
  - name: fiap-x/auth-service
    newName: fiap-x/auth-service
    newTag: local
  - name: fiap-x/video-service
    newName: fiap-x/video-service
    newTag: local
  - name: fiap-x/processor-service
    newName: fiap-x/processor-service
    newTag: local
  - name: fiap-x/notification-service
    newName: fiap-x/notification-service
    newTag: local
  - name: fiap-x/frontend
    newName: fiap-x/frontend
    newTag: local
