apiVersion: v1
kind: Secret
metadata:
  name: fiap-x-dependencies
  namespace: fiap-x
  labels:
    app.kubernetes.io/part-of: fiap-x
  annotations:
    fiap-x.io/example-only: 'true'
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: REPLACE_ME
  MYSQL_USERNAME: REPLACE_ME
  MYSQL_PASSWORD: REPLACE_ME
