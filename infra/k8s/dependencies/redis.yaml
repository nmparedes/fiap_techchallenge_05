apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: fiap-x
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: fiap-x
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fiap-x
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: fiap-x
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fiap-x
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: fiap-x
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: fiap-x
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7.4.5-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fiap-x-dependencies
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - test "$(redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping)" = PONG
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - test "$(redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping)" = PONG
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
