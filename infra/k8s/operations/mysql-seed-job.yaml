apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-seed
  namespace: fiap-x
  labels:
    app.kubernetes.io/name: mysql-seed
    app.kubernetes.io/part-of: fiap-x
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-seed
        app.kubernetes.io/part-of: fiap-x
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: fiap-x/auth-service:local
          imagePullPolicy: IfNotPresent
          command:
            - node
            - packages/infrastructure/dist/cli/seed.js
          env:
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PORT
              value: '3306'
            - name: MYSQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fiap-x-dependencies
                  key: MYSQL_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fiap-x-dependencies
                  key: MYSQL_PASSWORD
            - name: MYSQL_CONNECTION_LIMIT
              value: '2'
            - name: MYSQL_SSL
              value: 'false'
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
