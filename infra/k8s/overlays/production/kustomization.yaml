apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# These placeholders are rendered by deploy-production.yml. They intentionally
# remain unresolved for local use: this overlay must never be applied directly.
namespace: ${K8S_NAMESPACE}

resources:
  - ../../apps

images:
  - name: fiap-x/auth-service
    newName: ${IMAGE_REGISTRY}/fiap-x-auth-service
    newTag: ${IMAGE_TAG}
  - name: fiap-x/video-service
    newName: ${IMAGE_REGISTRY}/fiap-x-video-service
    newTag: ${IMAGE_TAG}
  - name: fiap-x/processor-service
    newName: ${IMAGE_REGISTRY}/fiap-x-processor-service
    newTag: ${IMAGE_TAG}
  - name: fiap-x/notification-service
    newName: ${IMAGE_REGISTRY}/fiap-x-notification-service
    newTag: ${IMAGE_TAG}
  - name: fiap-x/frontend
    newName: ${IMAGE_REGISTRY}/fiap-x-frontend
    newTag: ${IMAGE_TAG}

patches:
  - path: ingress.yaml
    target:
      kind: Ingress
      name: fiap-x
  - path: video-storage-video-service.yaml
    target:
      kind: Deployment
      name: video-service
  - path: video-storage-processor-service.yaml
    target:
      kind: Deployment
      name: processor-service
